name: Test & Deploy to Apify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install httpx
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apify build
        run: |
          curl -s -X POST \
            "https://api.apify.com/v2/acts/0eeiFH0nLqlWVoOAc/builds?token=${{ secrets.APIFY_TOKEN }}&version=0.1"
